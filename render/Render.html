  /* THE TRUTH PAGE'S LOOK, WITHOUT ITS CONTROLS (Jay, 2026-09-24: "clone the truth page... I like
     the way this looks a little better. Don't need any of the buttons in the left panel, and keep
     the mouse scroll zoom"). Same palette, same renderer, same 100 px per metre and wheel zoom --
     so a metre on this page is a metre on that one. What is gone is every editing control: this
     page only plays a recording back. */
  :root { --bg:#f6f4ee; --ink:#1d1f24; --wall:#2b2f38; --furn:#b6884a; --furnfill:#e8d3ae; --muted:#8a8f99; --ray:#ffffff;
          --phone:#3a6ea5; --me:#2a7de1; --dot:#c58a4a; }
  html, body { height:100%; } body { margin:0; background:var(--bg); color:var(--ink); font:13px system-ui, sans-serif; overflow:hidden; }
  svg { width:100vw; height:100vh; display:block; cursor:grab; }
  svg.drag { cursor:grabbing; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:46px; display:flex; align-items:center; gap:12px;
         padding:0 16px; background:rgba(246,244,238,.96); border-top:1px solid #e0dacb; z-index:4; }
  #bar button { font:inherit; padding:4px 12px; font-weight:700; }
  #seek { flex:1; width:100%; margin:0; position:relative; z-index:2; }
  /* THE GATE OPENS, DRAWN TO SCALE (Jay, 2026-09-30). Jay reads these tapes by dragging the slider
     frame by frame, so the one thing worth marking is where each utterance begins -- and the bracket
     is 0.5 s wide because that is BOOT_S, the window the bearing decision is actually made from.
     Inside a bracket the scheme is gathering evidence; outside it the value is held. */
  #seekwrap { flex:1; position:relative; display:block; }
  #onsets { position:absolute; left:0; right:0; top:50%; height:14px; margin-top:-7px; pointer-events:none; z-index:1; }
  #onsets i { position:absolute; top:0; height:14px; background:rgba(127,212,255,.30); border-left:2px solid #2f7fa8; box-sizing:border-box; }
  #head { position:fixed; left:16px; top:12px; z-index:4; color:var(--muted); font-size:12px; line-height:1.5; }
  /* Hidden, not removed (Jay, 2026-10-07): the per-tape mirror/move/turn are saved through its readout. */
  #head { display:none; }
  /* THE RANGE SCALE AS A SLIDER (Jay, 2026-10-14: "I don't have a mouse with a wheel. Can we have a vertical slider on the
     top left of the page to expand or shrink the unit to range scale?"). The same RAD_K shift+wheel turns, on a log scale
     over the wheel's own 0.01-100; top is longer. */
  #radk { position:fixed; left:16px; top:12px; z-index:6; display:flex; flex-direction:column; align-items:center; gap:6px;

       needs -- every burst is one stop, so the list IS the walk. Right-hand side because the
       head, controls and caption already own the left. */

              background:rgba(246,244,238,.94); border:1px solid #e0dacb; padding:8px 10px; }

     to work."). The caption and the decode list are hidden, not deleted: drawScript and the caption
     update still run against them harmlessly. Each bubble is tinted by its phrase's voice brightness

  #cap, #script { display:none !important; }
  #bubbles { position:fixed; left:0; top:0; width:0; height:0; z-index:3; pointer-events:none; }
  .bub { --bh:210; position:fixed; max-width:260px; padding:7px 11px; color:#1d1f24;

     screenshot"). The long aimed .tail was correct and ugly: a wedge crossing the map. A stub only works if the
     bubble is NEXT TO the dot, so placement below keeps it there and flips the stub to whichever corner faces it. */
  .bub::after { content:''; position:absolute; left:14px; bottom:-12px; width:16px; height:12px;
                background:hsl(var(--bh) 85% 93%); border-left:2px solid hsl(var(--bh) 55% 38%);
                border-bottom:2px solid hsl(var(--bh) 55% 38%); transform:skewX(-35deg); border-bottom-left-radius:3px; }
  /* THE GHOST (2026-10-06): the same words at the arrival a near-tie did not take -- dashed, flat, faint. */
  .bub.ghost { border-style:dashed; box-shadow:none; background:hsl(var(--bh) 60% 96%); color:#5a5f6a; font-weight:500; }
  .bub.ghost::after { border-left-style:dashed; border-bottom-style:dashed; }

  .bub.turned { opacity:0.45; }
  .bub.flip::after { left:auto; right:14px; transform:skewX(35deg); border-left:none;

     position"). The comic stub above is fixed to the bubble's own bottom-left corner, so as soon as a bubble is
     flipped to the other side or pushed upward to clear an older one, it points at nothing. This one is drawn per
     frame instead: a tapered triangle whose BASE sits on the bubble's border and whose APEX is the position itself,
     however far the bubble had to move. --bh is inherited from its bubble so it carries the same voice colour. */
  .tail { position:fixed; left:0; top:0; height:9px; transform-origin:0 50%; pointer-events:none; z-index:2;
          background:hsl(var(--bh) 55% 38%); clip-path:polygon(0 0, 0 100%, 100% 50%); }
  .tail.ghost { opacity:0.45; }

    .then(function (sc) { WORDS = sc.words || []; if (sc && (sc.segments || sc.centroid)) { DEC = sc; CENT = null; } })
    .catch(function () {})
    // WHISPER WINS WHERE IT EXISTS (Jay, 2026-09-29). scene.json's words are the handset's Android
    // recogniser, which drops whole bursts -- and no tape recorded since 09-24 has a scene at all,
    // so those played back with no text at all. The decode is the same audio read properly; where it
    // exists it REPLACES the captions rather than merging, because merging two transcripts of one
    // recording doubles the text everywhere they agree.
    .then(function () {
      return fetch('geonar/decode?name=' + encodeURIComponent(MEDIA_RUN), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (dc) {
          if (dc && (dc.segments || []).length) { DEC = dc; CENT = null; }   // a real decode wins; a sim keeps its scene
          BURSTS = (dc && dc.bursts) || [];
          var segs = (dc && dc.segments) || [];
          if (segs.length) {
            WORDS = segs.map(function (q) { return { start: q.start, stop: q.end, text: q.text }; });
          }
          drawScript(dc && dc.decoded);
        })
        .catch(function () { BURSTS = []; drawScript(false); });
    });
}).then(function () {
  document.getElementById('head').innerHTML =
    '<b>' + RUN + '</b> &nbsp; Conductor &rarr; math host &rarr; Render<br>' +
    ((OD && OD.truth && OD.truth.phone) ? ('phone ' + OD.truth.phone.x.toFixed(2) + ', ' + OD.truth.phone.y.toFixed(2) + ' m facing ' + Math.round(OD.truth.phone.angle) + '&deg; &nbsp;&middot;&nbsp; ' + ((OD.truth.stops || []).length) + ' marked positions') : 'this tape has no saved phone pose -- mark it on the Truth page') +
    '<br><span id="fopos">waiting for first speech arrival</span>' +
    (OPENING_ANCHOR ? ' &middot; opening anchor ' + OPENING_ANCHOR.r.toFixed(2) + ' m (' + OPENING_ANCHOR.src + '); 1 u = ' + UNIT_M.toFixed(2) + ' m before view scale' : RANGE_UNIT === 'u' ? ' &middot; range in opening units; enter the opening distance to convert to metres' : '') + ' &middot; scroll to zoom &middot; drag to pan' +
    (LIVING ? '<br><span id="calhud"></span>' : '');
  if (LIVING) calLoad();
  calHud();
  layout();
  if (SHOW_MASK) maskOpen(RUN);
  streamMessage();
  prepare();
  requestAnimationFrame(frame);
}).catch(function (e) {
  document.getElementById('head').innerHTML = '<b>' + (RUN || '(no tape)') + '</b><br>' + (e && e.message ? e.message : e) +
    '<br>open with ?run=walk-HHMMSS, or mark a tape on the Truth page first';
  requestAnimationFrame(frame);
});
</script>
